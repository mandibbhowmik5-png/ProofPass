name: ProofPass CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Build, Cryptographic Verification & Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install Root & Workspace Dependencies
        run: |
          npm ci || npm install
          npm --prefix backend install
          npm --prefix frontend install

      - name: 🔨 Compile Midnight Compact Smart Contract & Generate Bindings
        run: |
          npm run compile:compact
          test -f contracts/managed/proofpass/contract/index.ts
          test -f contracts/managed/proofpass/contract/proofpass.zkir.json
          test -f frontend/src/contracts/proofpass/index.ts
          echo "Compact contract compilation and bindings generation verified."

      - name: 🧪 Run Automated Tests (Backend + ZK Engine + Wallet + Compact Contract)
        run: |
          npm test

      - name: 🏗️ Build Production Client (Vite + TypeScript + Tailwind CSS)
        run: |
          npm run build

      - name: 🛡️ Verify Midnight Deployment Artifacts
        run: |
          test -f contracts/proofpass.compact
          test -f contracts/deploy/src/deploy.ts
          echo "Midnight Compact contract and deployment scripts verified."
